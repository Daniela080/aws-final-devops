name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # JOB 1: Validar código y correr pruebas
  test:
    name: Validacion y Pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # JOB 2: Validar Terraform (sin credenciales AWS)
  validate-terraform:
    name: Validacion Terraform
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # JOB 3: Confirmacion de despliegue
  deploy:
    name: Preparacion Despliegue
    runs-on: ubuntu-latest
    needs: validate-terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirmar despliegue listo
        run: |
          echo "Infraestructura desplegada en AWS"
          echo "ALB: ${{ secrets.ALB_DNS }}"
          echo "Instancia 1: ${{ secrets.INSTANCE_1_IP }}"
          echo "Instancia 2: ${{ secrets.INSTANCE_2_IP }}"